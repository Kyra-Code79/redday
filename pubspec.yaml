name: redday
description: "RedDay - a private, offline menstrual cycle tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

# Versions are pinned exactly. Every Android plugin below was audited for
# minSdk <= 24 (Android 7.0) — see README "Compatibility".
dependencies:
  flutter:
    sdk: flutter

  provider: 6.1.5+1
  sqflite: 2.4.4+2
  shared_preferences: 2.5.6
  flutter_local_notifications: 22.3.2
  timezone: 0.11.2
  flutter_timezone: 5.1.1
  intl: 0.20.3
  fl_chart: 1.2.0
  file_picker: 13.1.0
  path: 1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.4.4

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 800
